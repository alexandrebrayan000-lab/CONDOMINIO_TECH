<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="../css/feedback.css">
    <link rel="icon" href="../img/logoReservaTech.png">
</head>
<body>
    <header class="header-unico">
        <div class="logo-container">
            <img src="../img/logoReservaTech.png" alt="logo da empresa" class="logo-img">
        </div>
        <h1 class="titulo-boas-vindas">Feedback</h1>
        <nav class="botoes-menu">
            <a href="../index.html" class="btn-nav btn-login">Início</a>
        </nav>
    </header>

    <main>
        <div class="formulario">
            <figure>
                <figcaption>
                    <h2>Conte para a gente o que você achou!</h2>
                    <br>
                </figcaption>

                <form action="#" method="post" class="texto">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>

                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                    <div class="botoes-linha">
                        <button class="cadastro" type="submit">Enviar</button>
                    </div>
                </form>
            </figure>
        </div>
    </main>

    <footer>
        &copy; 2026 ReservAtiva. Todos os direitos reservados.
    </footer>
</body>
</html>
